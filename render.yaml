services:
  - type: web
    name: radiology-report-audit-app
    env: python
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "gunicorn server:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
